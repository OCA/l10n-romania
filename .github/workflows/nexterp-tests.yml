# Fisier doar al fork-ului NextERP: nu se trimite in PR-urile catre OCA.
# Workflow-urile OCA (tests, pre-commit, stale) sunt dezactivate in fork din
# setari (gh workflow disable), ca sa nu consume minute GitHub; fisierele lor
# raman neschimbate, deci sincronizarea cu OCA nu da conflicte.
#
# Ruleaza pe runnerele self-hosted din grupul public-l10n (eticheta
# nexterp-public). Repo-ul e PUBLIC: jobul porneste DOAR pentru PR-uri din
# branch-uri ale acestui repo (scriere = doar echipa); PR-urile din fork-uri
# straine nu ajung niciodata pe serverul nostru.
name: nexterp-tests

on:
  pull_request:
    branches:
      - "19.0*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nexterp-public]
    container: python:3.11
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: |
          git config --global --add safe.directory "$PWD"
          pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          SKIP: oca-gen-addon-readme
      - name: Check that all files generated by pre-commit are in git
        run: |
          newfiles="$(git ls-files --others --exclude-from=.gitignore)"
          if [ "$newfiles" != "" ] ; then
              echo "Please check-in the following files:"
              echo "$newfiles"
              exit 1
          fi

  test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, nexterp-public]
    container: ghcr.io/oca/oca-ci/py3.10-odoo19.0:latest
    name: test with Odoo (${{ matrix.shard }}/4)
    # Testele Odoo ruleaza intr-un singur proces, pe un singur nucleu, iar
    # nucleele serverului sunt lente: suita completa dura ~30 min. Modulele
    # se impart pe 4 joburi paralele dupa timpul lor de test
    # (.github/scripts/shard_addons.py); fiecare job are baza lui.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:13
        # Datele pe tmpfs: bazele de test sunt de unica folosinta.
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=6g
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        # Fara mapare de port: runnerele impart acelasi daemon docker, jobul
        # ajunge la serviciu pe nume (PGHOST=postgres din imaginea oca-ci).
    env:
      OCA_ENABLE_CHECKLOG_ODOO: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # addons_to_test.py compara cu baza pull request-ului.
          fetch-depth: 0
      # Doar modulele atinse de PR si cele care depind de ele (INCLUDE, citit
      # de oca-ci). O schimbare in afara modulelor (workflow, requirements)
      # testeaza tot. Workflow-urile OCA (test.yml) nu sunt atinse.
      - name: Select addons to test
        run: |
          git config --global --add safe.directory "$PWD"
          git fetch --no-tags origin \
              "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          INCLUDE=$(python3 .github/scripts/addons_to_test.py "origin/${{ github.base_ref }}" HEAD)
          if [ -n "${INCLUDE}" ]; then
              echo "Testing only: ${INCLUDE}"
              echo "INCLUDE=${INCLUDE}" >> $GITHUB_ENV
          else
              echo "Change reaches outside the addons: testing everything."
          fi
      - name: Select this shard's addons
        run: |
          SHARD=$(python3 .github/scripts/shard_addons.py $(( ${{ matrix.shard }} - 1 )) 4)
          if [ -z "${SHARD}" ]; then
              echo "Nothing to test in this shard."
              echo "SKIP_SHARD=1" >> $GITHUB_ENV
          else
              echo "Shard ${{ matrix.shard }}/4: ${SHARD}"
              # Lantul complet din repo se instaleaza la pasul de teste, intr-un
              # singur -i; INCLUDE il face pe oca_init_test_database sa instaleze
              # doar dependintele din afara repo-ului.
              CLOSURE=$(python3 .github/scripts/shard_addons.py $(( ${{ matrix.shard }} - 1 )) 4 --closure)
              echo "INCLUDE=${CLOSURE}" >> $GITHUB_ENV
              echo "SHARD_TAGS=$(echo "${SHARD}" | sed 's#\([^,]*\)#/\1#g')" >> $GITHUB_ENV
          fi
      - name: Install addons and dependencies
        if: env.SKIP_SHARD != '1'
        run: oca_install_addons
      - name: Check licenses
        if: env.SKIP_SHARD != '1'
        run: manifestoo -d . check-licenses
      - name: Check development status
        if: env.SKIP_SHARD != '1'
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        if: env.SKIP_SHARD != '1'
        run: oca_init_test_database
      # Ca oca_run_tests, dar doar testele shard-ului (--test-tags).
      - name: Run tests
        if: env.SKIP_SHARD != '1'
        run: |
          set -o pipefail
          oca_wait_for_postgres
          unbuffer $(which odoo) -d ${PGDATABASE} -i ${INCLUDE} \
              --test-enable --test-tags "${SHARD_TAGS}" \
              --http-interface=127.0.0.1 --stop-after-init | oca_checklog_odoo
